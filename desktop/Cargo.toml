[package]
name = "streamchat"
version = "0.2.2"
edition = "2021"
description = "Twitch, Kick and TikTok chat in one window, with an OBS overlay"
license = "MIT"

[[bin]]
name = "streamchat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
open = "5"
rand = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
